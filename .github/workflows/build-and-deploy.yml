name: Build AI-on-the-Edge browser flasher

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out flasher project
        uses: actions/checkout@v6

      - name: Check out upstream AI-on-the-Edge v16.1.0
        uses: actions/checkout@v6
        with:
          repository: jomjol/AI-on-the-edge-device
          ref: v16.1.0
          path: upstream
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install platformio==6.1.18 esptool==4.8.1

      - name: Build stock and 8 MHz firmware
        run: python scripts/build_firmware.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy browser flasher to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
